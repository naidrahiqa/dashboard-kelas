name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Siapkan nama APK
        run: |
          mkdir -p dist
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            cp app/build/outputs/apk/debug/app-debug.apk "dist/DashboardKelas-${GITHUB_REF#refs/tags/}.apk"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "dist/DashboardKelas-latest.apk"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk

      - name: Rilis versi (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" dist/*.apk \
            --title "Dashboard Kelas ${GITHUB_REF#refs/tags/}" \
            --generate-notes

      - name: Rilis build terbaru (main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest dist/*.apk \
            --title "Build Terbaru" \
            --notes "APK debug otomatis dari commit ${{ github.sha }}.

          Cara install: unduh APK, buka, izinkan install dari sumber tidak dikenal."
